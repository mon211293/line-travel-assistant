name: Trigger LINE travel itinerary functions

on:
  schedule:
    - cron: "0 22 * * *" # 07:00 Asia/Tokyo 每日行程推播
    - cron: "*/15 * * * *" # 每 15 分鐘檢查即將開始的活動
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger dailyItinerary
        if: github.event.schedule == '0 22 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sf -X POST "https://dailyitinerary-tl6b6jk2mq-de.a.run.app/" \
            -H "x-trigger-secret: ${{ secrets.TRIGGER_SECRET }}"

      - name: Trigger itineraryReminder
        if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sf -X POST "https://itineraryreminder-tl6b6jk2mq-de.a.run.app/" \
            -H "x-trigger-secret: ${{ secrets.TRIGGER_SECRET }}"

      - name: Trigger weatherPush
        if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sf -X POST "https://weatherpush-tl6b6jk2mq-de.a.run.app/" \
            -H "x-trigger-secret: ${{ secrets.TRIGGER_SECRET }}"

      - name: Trigger scheduledMessagePush
        if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sf -X POST "https://scheduledmessagepush-tl6b6jk2mq-de.a.run.app/" \
            -H "x-trigger-secret: ${{ secrets.TRIGGER_SECRET }}"
